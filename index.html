<!DOCTYPE html>
<html lang="en">
  
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
  <div id="controlParams">
    <form>
      <button type="button" id="buttonGenerates">Generate rolls</button>
      <br>
      <button type="button" id="buttonRolls">Roll</button>
      <button type="button" id="button5Rolls">5x Rolls</button>
      <br>
      <button type="button" id="hourlyRolls">Hourly Roll Claim</button>
      <br>
      <button type="button" id="resetSessionStorage">Reset Session</button>
      <br>
      <label for="fieldGenerates">Rolls to generate:</label>
      <input type="number" id="fieldGenerates" min="0" max="1000">
    </form>
  </div>
  <div id="rolls">

  </div>
  <div id="placeholder">    
  </div>
  <div>
    <h4>
      <div id="visiblePokes">
        <table type="table" id="visiblePokesTable">
          <tr id="pokeHeader">
            <th>Pokemon Number</th>
            <th>Number Collected</th>
          </tr>
        </table>
      </div>
    </h4>
  </div>
  <script src="script.js"></script>
  </div>
</body>
</html>
